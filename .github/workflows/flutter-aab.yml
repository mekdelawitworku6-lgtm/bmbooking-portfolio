name: Build Flutter AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Generate Android platform files if missing
        run: |
          flutter create --platforms=android --org com.possibletech --project-name bm_booking_app mobile
          git checkout -- mobile/pubspec.yaml mobile/lib mobile/assets mobile/analysis_options.yaml || true
          rm -rf mobile/test
          grep -q 'android.permission.INTERNET' mobile/android/app/src/main/AndroidManifest.xml || \
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' mobile/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build app bundle
        working-directory: mobile
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://bmbookingapi.possibletechplc.com/api \
            --build-name=1.0.0 --build-number=1

      - uses: actions/upload-artifact@v4
        with:
          name: bm-booking-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
