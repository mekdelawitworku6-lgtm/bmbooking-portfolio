# Render Blueprint for the BM Booking web portal.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bmbooking-portfolio
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    # Standalone server reads PORT (injected by Render); force 0.0.0.0 so it is publicly reachable.
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://bmbookingapi.possibletechplc.com
      - key: NEXT_PUBLIC_TELEBIRR_URL
        value: https://bmtelebirr.possibletechplc.com
